<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PetPals - Forgot Password</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "secondary-container": "#fdceae",
            "on-secondary-container": "#78563c",
            "on-primary-fixed-variant": "#633e25",
            "on-background": "#1c1c19",
            "on-primary-container": "#ffe9dd",
            "outline-variant": "#d5c3ba",
            "on-tertiary-fixed-variant": "#4c463b",
            "tertiary-fixed": "#ebe1d2",
            "outline": "#83746c",
            "surface-dim": "#dcdad5",
            "background": "#fcf9f4",
            "surface-container-highest": "#e5e2dd",
            "on-surface": "#1c1c19",
            "on-tertiary": "#ffffff",
            "secondary-fixed-dim": "#ebbd9e",
            "primary-fixed-dim": "#f0bc9a",
            "surface-container-high": "#ebe8e3",
            "tertiary-fixed-dim": "#cfc5b7",
            "on-tertiary-container": "#f6ecdc",
            "surface-variant": "#e5e2dd",
            "on-error-container": "#93000a",
            "inverse-on-surface": "#f3f0eb",
            "secondary": "#7a573d",
            "on-tertiary-fixed": "#201b12",
            "surface-tint": "#7d553a",
            "on-secondary": "#ffffff",
            "tertiary-container": "#716a5e",
            "surface-container": "#f0ede9",
            "on-secondary-fixed-variant": "#5f4028",
            "surface-container-lowest": "#ffffff",
            "inverse-primary": "#f0bc9a",
            "on-primary": "#ffffff",
            "on-secondary-fixed": "#2d1603",
            "surface": "#fcf9f4",
            "surface-bright": "#fcf9f4",
            "primary": "#714a30",
            "error-container": "#ffdad6",
            "on-primary-fixed": "#301401",
            "error": "#ba1a1a",
            "tertiary": "#595247",
            "surface-container-low": "#f6f3ee",
            "on-error": "#ffffff",
            "primary-fixed": "#ffdcc7",
            "primary-container": "#8c6246",
            "on-surface-variant": "#50443d",
            "inverse-surface": "#31302d",
            "secondary-fixed": "#ffdcc5"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline-sm": [ "Playfair Display" ],
            "display-mobile": [ "Playfair Display" ],
            "body-sm": [ "Plus Jakarta Sans" ],
            "headline-lg-mobile": [ "Playfair Display" ],
            "label-lg": [ "Plus Jakarta Sans" ],
            "label-sm": [ "Plus Jakarta Sans" ],
            "headline-lg": [ "Playfair Display" ],
            "title-md": [ "Plus Jakarta Sans" ],
            "display": [ "Playfair Display" ],
            "body-lg": [ "Plus Jakarta Sans" ],
            "body-md": [ "Plus Jakarta Sans" ],
            "label-md": [ "Plus Jakarta Sans" ],
            "headline-md": [ "Playfair Display" ]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-6">
  <div class="pointer-events-none absolute -top-24 -right-24 w-96 h-96 rounded-full bg-secondary-container/20 blur-3xl -z-10"></div>
  <div class="pointer-events-none absolute bottom-0 left-0 w-72 h-72 rounded-tr-[120px] bg-secondary-fixed/20 -z-10"></div>

  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 sm:p-12 shadow-xl shadow-on-surface/5 relative text-center">
    <div class="mb-6 flex justify-center">
      <a href="/" class="inline-block transition-transform hover:scale-[1.02]">
        <span class="material-symbols-outlined text-[28px] text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
      </a>
    </div>

    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-surface-container mb-4 text-primary">
      <span class="material-symbols-outlined text-2xl">lock_reset</span>
    </div>

    <h1 class="font-headline-md text-2xl font-bold text-on-surface mb-2">Forgot Password</h1>
    <p class="font-body-md text-sm text-on-surface-variant mb-6">
      Enter your email address and we'll send you instructions to reset your PetPals password.
    </p>

    <form id="forgot-form" class="space-y-4">
      <div class="text-left">
        <label class="font-label-sm text-xs uppercase tracking-wider text-on-surface-variant font-semibold" for="reset-email">Email Address</label>
        <div class="relative flex items-center mt-1">
          <span class="material-symbols-outlined absolute left-4 text-outline text-lg">mail</span>
          <input class="w-full bg-surface-container-lowest text-on-surface pl-11 pr-4 py-3 rounded-full border border-outline-variant/60 focus:outline-none focus:ring-2 focus:ring-primary-container text-sm" id="reset-email" type="email" placeholder="you@example.com" required/>
        </div>
      </div>
      <div id="reset-success-msg" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium text-left">
        Password reset instructions have been sent to your email. Check your inbox!
      </div>
      <button class="w-full py-3.5 px-6 rounded-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-semibold text-sm transition-all shadow-md shadow-primary/20" type="submit">
        Send Reset Link
      </button>
    </form>

    <div class="mt-8 pt-4 border-t border-surface-container-high">
      <a href="/login" class="inline-flex items-center gap-1.5 text-sm font-semibold text-primary hover:underline">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        Back to Sign In
      </a>
    </div>
  </div>
  <script>
    document.getElementById('forgot-form')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const msg = document.getElementById('reset-success-msg');
      if (msg) msg.classList.remove('hidden');
      setTimeout(() => { window.location.href = '/login'; }, 2000);
    });
  </script>
</body>
</html>
