<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>PetPals - Create Account</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { "primary": "#714a30", "on-primary-fixed-variant": "#633e25", "surface": "#fcf9f4", "surface-container-low": "#f6f3ee", "surface-container": "#f0ede9", "on-surface": "#1c1c19", "on-surface-variant": "#50443d", "outline": "#83746c", "outline-variant": "#d5c3ba" } } } };</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fcf9f4; }
</style>
<script src="/portal-common.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-surface">

  <!-- Ambient blobs -->
  <div class="fixed -top-20 -right-20 w-80 h-80 rounded-full pointer-events-none" style="background:rgba(253,206,174,0.25);filter:blur(60px);z-index:0"></div>
  <div class="fixed -bottom-20 -left-20 w-96 h-96 rounded-full pointer-events-none" style="background:rgba(255,220,197,0.2);filter:blur(60px);z-index:0"></div>
  <!-- Paw watermarks -->
  <span class="fixed top-6 right-14 pointer-events-none select-none" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;color:#714a30;opacity:0.06;z-index:0;transform:rotate(15deg);font-size:90px">pets</span>
  <span class="fixed bottom-8 left-10 pointer-events-none select-none" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;color:#714a30;opacity:0.06;z-index:0;transform:rotate(-20deg);font-size:70px">pets</span>

  <!-- Main card — wider max-w-md -->
  <div class="relative z-10 w-full max-w-md mx-5">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-4">
      <a href="/" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" style="font-size:26px;font-variation-settings:'FILL' 1;">pets</span>
        <span class="font-bold text-primary" style="font-family:'Playfair Display';font-size:19px;">PetPals</span>
      </a>
      <a href="/login" class="text-xs font-semibold text-primary hover:underline">Already have an account? <span class="underline">Sign In</span></a>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-black/6 px-7 py-6 border border-outline-variant/30">

      <!-- Title -->
      <div class="text-center mb-4">
        <div class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-surface-container-low mb-2">
          <span class="material-symbols-outlined text-primary" style="font-size:22px;font-variation-settings:'FILL' 1;">pets</span>
        </div>
        <h1 class="font-bold text-on-surface" style="font-family:'Playfair Display';font-size:23px;line-height:1.25;">Create Your Account</h1>
        <p class="text-on-surface-variant text-xs mt-1">Join the PetPals family 🐾</p>
      </div>

      <!-- Google Sign Up -->
      <button type="button" id="google-signup-btn"
        class="w-full flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface text-sm font-semibold transition-all border border-outline-variant/40 mb-3">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12z" fill="#4285F4"/>
          <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.27 21.43 7.35 24 12 24z" fill="#34A853"/>
          <path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.57H1.25C.45 8.16 0 9.98 0 12s.45 3.84 1.25 5.43l4.03-3.14z" fill="#FBBC05"/>
          <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.57 1.25 6.57l4.03 3.14c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <!-- OR -->
      <div class="flex items-center gap-3 mb-3">
        <div class="flex-1 h-px bg-outline-variant/50"></div>
        <span class="text-[10px] font-bold tracking-widest uppercase text-outline">or</span>
        <div class="flex-1 h-px bg-outline-variant/50"></div>
      </div>

      <!-- Form -->
      <form id="register-form" class="space-y-2.5">

        <!-- Error alert -->
        <div id="register-error-alert" class="hidden p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2">
          <span class="material-symbols-outlined text-red-600 text-base shrink-0">error</span>
          <span id="register-error-text">Please check your information</span>
        </div>

        <!-- Row 1: Name + Phone -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="name">Full Name</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:15px;">person</span>
              <input id="name" name="name" type="text" required placeholder="Sarah Jenkins" autocomplete="name"
                class="w-full pl-8 pr-3 py-2.5 rounded-full bg-surface-container-low text-on-surface text-xs placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 border border-outline-variant/40"/>
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="phone">Phone</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:15px;">call</span>
              <input id="phone" name="phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel"
                class="w-full pl-8 pr-3 py-2.5 rounded-full bg-surface-container-low text-on-surface text-xs placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 border border-outline-variant/40"/>
            </div>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="email">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:15px;">mail</span>
            <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email"
              class="w-full pl-8 pr-3 py-2.5 rounded-full bg-surface-container-low text-on-surface text-xs placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 border border-outline-variant/40"/>
          </div>
        </div>

        <!-- Row 2: Password + Confirm -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="password">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:15px;">lock</span>
              <input id="password" name="password" type="password" required placeholder="Create password" autocomplete="new-password"
                class="w-full pl-8 pr-8 py-2.5 rounded-full bg-surface-container-low text-on-surface text-xs placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 border border-outline-variant/40"/>
              <button id="toggle-password" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface">
                <span id="pwd-icon" class="material-symbols-outlined" style="font-size:14px;">visibility</span>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="confirm-password">Confirm</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:15px;">lock_reset</span>
              <input id="confirm-password" name="confirm-password" type="password" required placeholder="Re-enter" autocomplete="new-password"
                class="w-full pl-8 pr-8 py-2.5 rounded-full bg-surface-container-low text-on-surface text-xs placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 border border-outline-variant/40"/>
              <button id="toggle-confirm" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface">
                <span id="confirm-icon" class="material-symbols-outlined" style="font-size:14px;">visibility</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Terms -->
        <label class="flex items-center gap-2 cursor-pointer pt-0.5">
          <input type="checkbox" id="terms" name="terms" required class="w-3.5 h-3.5 rounded accent-primary flex-shrink-0"/>
          <span class="text-xs text-on-surface-variant leading-snug">I agree to the
            <a href="#" class="text-primary font-semibold hover:underline">Terms of Service</a> &amp;
            <a href="#" class="text-primary font-semibold hover:underline">Privacy Policy</a>
          </span>
        </label>

        <!-- Submit -->
        <button type="submit"
          class="w-full py-3 px-4 rounded-full bg-primary hover:bg-on-primary-fixed-variant text-white text-sm font-bold transition-all duration-200 shadow-md shadow-primary/20 flex items-center justify-center gap-2">
          <span>Create Account</span>
          <span class="material-symbols-outlined" style="font-size:16px;">arrow_forward</span>
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-on-surface-variant mt-3.5">
        Already have an account?
        <a href="/login" class="text-primary font-bold hover:underline ml-0.5">Sign In</a>
      </p>
    </div>

    <!-- Trust line -->
    <div class="text-center mt-2.5">
      <span class="inline-flex items-center gap-1.5 text-[10px] text-outline">
        <span class="material-symbols-outlined" style="font-size:12px;">verified_user</span>
        256-bit SSL · PetParent Certified
      </span>
    </div>
  </div>

  <script src="/portal-common.js"></script>
  <script>
    (function() {
      function makeToggle(btnId, inputId, iconId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (btn && input && icon) {
          btn.addEventListener('click', function() {
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            icon.textContent = isPass ? 'visibility_off' : 'visibility';
          });
        }
      }
      makeToggle('toggle-password', 'password', 'pwd-icon');
      makeToggle('toggle-confirm', 'confirm-password', 'confirm-icon');

      const form = document.getElementById('register-form');
      const submitBtn = form?.querySelector('button[type="submit"]');
      const errorAlert = document.getElementById('register-error-alert');
      const errorText = document.getElementById('register-error-text');

      function showError(msg) {
        if (errorAlert && errorText) {
          errorText.textContent = msg || 'Please check your information and try again.';
          errorAlert.classList.remove('hidden');
        }
      }
      function clearError() {
        if (errorAlert) {
          errorAlert.classList.add('hidden');
        }
      }

      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          clearError();

          const nameInput = document.getElementById('name');
          const phoneInput = document.getElementById('phone');
          const emailInput = document.getElementById('email');
          const passInput = document.getElementById('password');
          const confirmInput = document.getElementById('confirm-password');
          const termsInput = document.getElementById('terms');

          const name = nameInput ? nameInput.value.trim() : '';
          const phone = phoneInput ? phoneInput.value.trim() : '';
          const email = emailInput ? emailInput.value.trim() : '';
          const password = passInput ? passInput.value : '';
          const confirmPassword = confirmInput ? confirmInput.value : '';

          // Validation
          if (!name || name.length < 2) {
            showError('Please enter your full name (at least 2 characters).');
            if (nameInput) nameInput.focus();
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!email || !emailRegex.test(email)) {
            showError('Please enter a valid email address.');
            if (emailInput) emailInput.focus();
            return;
          }

          if (!password || password.length < 6) {
            showError('Password must be at least 6 characters long.');
            if (passInput) passInput.focus();
            return;
          }

          if (password !== confirmPassword) {
            showError('Passwords do not match. Please re-enter your password.');
            if (confirmInput) confirmInput.focus();
            return;
          }

          if (termsInput && !termsInput.checked) {
            showError('You must agree to the Terms of Service & Privacy Policy.');
            return;
          }

          const originalBtnHtml = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = `
            <svg class="animate-spin h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creating Account...</span>
          `;

          try {
            const res = await fetch('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({
                name,
                email,
                password,
                phone,
                location: ''
              })
            });

            const data = await res.json();
            if (!res.ok || !data.success) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalBtnHtml;
              showError(data.error || 'Failed to create account. Please try again.');
              return;
            }

            // Fresh account created: clear any prior user's cached storage
            try {
              localStorage.removeItem('petpals_pets');
              localStorage.removeItem('petpals_bookings');
              localStorage.removeItem('petpals_active_booking');
              localStorage.removeItem('petpals_user');
            } catch (e) {}

            // Successfully registered and authenticated with PostgreSQL session
            if (data.token) {
              try {
                localStorage.setItem('petpals_session_token', data.token);
                document.cookie = 'petpals_session=' + encodeURIComponent(data.token) + '; path=/; max-age=604800; SameSite=Lax';
              } catch (e) {}
            }
            if (window.PetPalsStore) {
              window.PetPalsStore.login(data.user, data.token);
            }
            window.location.href = '/dashboard?session_token=' + encodeURIComponent(data.token || '');
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHtml;
            showError('Network error connecting to the server. Please try again.');
          }
        });
      }

      const googleBtn = document.getElementById('google-signup-btn');
      if (googleBtn) {
        googleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          showError('Please create your account using the registration form.');
        });
      }
    })();
  </script>
</body></html>
