<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>PetPals - Sign In</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: {
  "primary": "#714a30", "on-primary-fixed-variant": "#633e25",
  "surface": "#fcf9f4", "surface-container-low": "#f6f3ee",
  "surface-container": "#f0ede9", "on-surface": "#1c1c19",
  "on-surface-variant": "#50443d", "outline": "#83746c", "outline-variant": "#d5c3ba"
} } } };</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fcf9f4; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen bg-surface">

  <!-- Ambient blobs -->
  <div class="fixed -top-20 -right-20 w-80 h-80 rounded-full pointer-events-none" style="background:rgba(253,206,174,0.25);filter:blur(60px);z-index:0"></div>
  <div class="fixed -bottom-20 -left-20 w-96 h-96 rounded-full pointer-events-none" style="background:rgba(255,220,197,0.2);filter:blur(60px);z-index:0"></div>
  <!-- Paw watermarks -->
  <span class="fixed top-6 right-14 pointer-events-none select-none" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;color:#714a30;opacity:0.06;z-index:0;transform:rotate(15deg);font-size:90px">pets</span>
  <span class="fixed bottom-8 left-10 pointer-events-none select-none" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;color:#714a30;opacity:0.06;z-index:0;transform:rotate(-20deg);font-size:70px">pets</span>
  <span class="fixed top-1/2 right-4 pointer-events-none select-none" style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1;color:#714a30;opacity:0.04;z-index:0;transform:rotate(8deg);font-size:55px">pets</span>

  <!-- Main card — wider max-w-md to match register -->
  <div class="relative z-10 w-full max-w-md mx-5">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-4">
      <a href="/" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" style="font-size:26px;font-variation-settings:'FILL' 1;">pets</span>
        <span class="font-bold text-primary" style="font-family:'Playfair Display';font-size:19px;">PetPals</span>
      </a>
      <a href="/register" class="text-xs font-semibold text-primary hover:underline">New? <span class="underline">Sign Up</span></a>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-black/6 px-7 py-6 border border-outline-variant/30">

      <!-- Title -->
      <div class="text-center mb-5">
        <div class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-surface-container-low mb-2">
          <span class="material-symbols-outlined text-primary" style="font-size:22px;font-variation-settings:'FILL' 1;">pets</span>
        </div>
        <h1 class="font-bold text-on-surface" style="font-family:'Playfair Display';font-size:25px;line-height:1.2;">Welcome Back</h1>
        <p class="text-on-surface-variant text-xs mt-1">Sign in to your PetPals account</p>
      </div>

      <!-- Google Sign In -->
      <button id="google-signin-btn" type="button"
        class="w-full flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface text-sm font-semibold transition-all duration-200 shadow-sm border border-outline-variant/40 mb-4">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12z" fill="#4285F4"/>
          <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.27 21.43 7.35 24 12 24z" fill="#34A853"/>
          <path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.57H1.25C.45 8.16 0 9.98 0 12s.45 3.84 1.25 5.43l4.03-3.14z" fill="#FBBC05"/>
          <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.57 1.25 6.57l4.03 3.14c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <!-- OR divider -->
      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 h-px bg-outline-variant/60"></div>
        <span class="text-[10px] font-bold tracking-widest uppercase text-outline">or</span>
        <div class="flex-1 h-px bg-outline-variant/60"></div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-3">

        <!-- Email -->
        <div>
          <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="email">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:16px;">mail</span>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
              class="w-full pl-9 pr-3 py-2.5 rounded-full bg-surface-container-low text-on-surface text-sm placeholder:text-outline/60 focus:outline-none focus:ring-2 focus:ring-primary/25 border border-outline-variant/40 transition-all"/>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-[10px] font-bold tracking-wider uppercase text-on-surface-variant mb-1" for="password">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-size:16px;">lock</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"
              class="w-full pl-9 pr-10 py-2.5 rounded-full bg-surface-container-low text-on-surface text-sm placeholder:text-outline/60 focus:outline-none focus:ring-2 focus:ring-primary/25 border border-outline-variant/40 transition-all"/>
            <button id="toggle-password" type="button" aria-label="Toggle password visibility"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
              <span id="toggle-icon" class="material-symbols-outlined" style="font-size:17px;">visibility</span>
            </button>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="remember" class="w-3.5 h-3.5 rounded accent-primary"/>
            <span class="text-xs text-on-surface-variant">Remember me</span>
          </label>
          <a href="/forgot-password" class="text-xs font-semibold text-primary hover:underline">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <button type="submit"
          class="w-full py-3 px-4 rounded-full bg-primary hover:bg-on-primary-fixed-variant text-white text-sm font-bold transition-all duration-200 shadow-md shadow-primary/20 flex items-center justify-center gap-2 mt-1">
          <span>Sign In</span>
          <span class="material-symbols-outlined" style="font-size:16px;">arrow_forward</span>
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-on-surface-variant mt-4">
        New to PetPals?
        <a href="/register" class="text-primary font-bold hover:underline ml-0.5">Create an account</a>
      </p>
    </div>

    <!-- Trust badge -->
    <div class="text-center mt-2.5">
      <span class="inline-flex items-center gap-1.5 text-[10px] text-outline">
        <span class="material-symbols-outlined" style="font-size:12px;">verified_user</span>
        Secure &amp; private veterinary access
      </span>
    </div>
  </div>

  <!-- Google OAuth toast -->
  <div id="oauth-toast" class="fixed bottom-5 right-5 max-w-xs bg-white border border-outline-variant/60 shadow-lg rounded-2xl p-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50 flex items-start gap-2" role="alert">
    <span class="material-symbols-outlined text-primary flex-shrink-0" style="font-size:20px;">info</span>
    <div class="flex-1">
      <p class="text-xs font-semibold text-on-surface">Google OAuth Placeholder</p>
      <p class="text-[10px] text-on-surface-variant mt-0.5">Google OAuth integration placeholder — ready to connect.</p>
    </div>
    <button id="close-toast" type="button" class="text-outline hover:text-on-surface" aria-label="Close">
      <span class="material-symbols-outlined" style="font-size:16px;">close</span>
    </button>
  </div>

  <script>
    (function() {
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggle-icon');
      if (toggleBtn && passInput && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleIcon.textContent = isPass ? 'visibility_off' : 'visibility';
        });
      }
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          window.location.href = '/dashboard';
        });
      }
      const googleBtn = document.getElementById('google-signin-btn');
      const toast = document.getElementById('oauth-toast');
      const closeBtn = document.getElementById('close-toast');
      let timer;
      function showToast() {
        if (!toast) return;
        toast.classList.remove('translate-y-20','opacity-0','pointer-events-none');
        toast.classList.add('translate-y-0','opacity-100','pointer-events-auto');
        timer = setTimeout(hideToast, 4000);
      }
      function hideToast() {
        if (!toast) return;
        toast.classList.add('translate-y-20','opacity-0','pointer-events-none');
        toast.classList.remove('translate-y-0','opacity-100','pointer-events-auto');
      }
      if (closeBtn) closeBtn.addEventListener('click', hideToast);
      if (googleBtn) googleBtn.addEventListener('click', function(e) { e.preventDefault(); showToast(); });
    })();
  </script>
</body></html>
